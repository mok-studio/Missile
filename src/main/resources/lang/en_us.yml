# Missile language file (English)
# Placeholders use {name}; color codes use &. Switch with config.yml: language: en_us

prefix: "&6[Missile] &f"

console:
  enabled: "Missile enabled: right-click with TNT to arm the seeker, right-click again to fire"
  no-command: "plugin.yml is missing the missile command; /missile is unavailable"
  lang-loaded: "Language file loaded: lang/{locale}.yml ({count} entries)"

command:
  player-only: "&cThis command can only be used by a player"
  no-permission: "&cYou do not have permission to use the missile system"
  unknown-missile: "&cUnknown missile type: &f{input} &7(options: ir / semi / active / semiLOS)"
  unknown-kind: "&cUnknown lock target type: &f{input} &7(options: player / entity)"
  selected: "&fType: &e{missile} &7| Lock: &f{kind} &7(initial {min} / max {max} m/s{extra})"
  status-missile: "&fCurrent type: &e{missile} &7(initial {min} m/s / max {max} m/s{extra})"
  status-detail: "&7Lock type: &f{kind} &7| Seeker: {seeker} &7| Locked: &f{target}"
  status-ir: "&7IR mode: &f{ir} &7| whitelist lock (usefilter): {filter}"
  status-sa: "&7SA missile lock type: &f{sa}"
  usage: "&7Usage: &f/missile <ir|semi|active|semiLOS|super_active> [args] &7| &f/missile filter ... &7| &f/missile <on|off> &7| &f/missile default &7| &f/missile status"
  usage-brief: "&7Admin: &f/missile global <on|off> &7| &f/missile reload &7| right-click with TNT to arm, again to fire"
  detail-beam: " &7| &bbeam riding"
  detail-decoy: " &7| countermeasure {decoy} {chance}%"
  state-on: "&aarmed"
  state-off: "&cnot armed"
  target-none: "none"
  enabled: "&aMissiles enabled: right-click with TNT to arm the seeker, again to fire"
  disabled: "&eMissiles disabled: TNT behaves like vanilla again (placing TNT works)"
  # /msl default: resets every missile setting of the sender (type and on/off are kept)
  default-reset: "&aAll missile settings restored to default (missile type and /msl on|off are kept)"
  status-switch: "&7Missile switch: {switch}"
  switch-on: "&aon"
  switch-off: "&coff"
  global-switch: "&7Global missile system: {switch}"
  # ---- admin commands (missile.admin) ----
  reloaded: "&6[Missile] &aPlugin configuration reloaded!"
  admin-only: "&cYou do not have permission to use this admin command"
  global-on: "&aGlobal missile system enabled"
  global-off: "&cGlobal missile system disabled (player settings untouched)"
  sa-default: "&cSA missile settings restored to default"
  sa-entity: "&aSA missile: target creatures (any non-player entity)"
  sa-player: "&aSA missile: target players (excluding yourself)"
  sa-filter-header: "&7SA safilter ({mode}):"
  sa-filter-empty: "  &7(empty = unrestricted)"
  sa-filter-entities: "  &7Entities: &f{values}"
  sa-filter-players: "  &7Players: &f{values}"
  # ---- safilter entry editing (1.0.3: /msl super_active <entity|player> set|add|remove|clear) ----
  # {type} is the class name typed in the command (entity / player); {values} are the entries involved
  sa-list-set: "&aSA safilter {type} class set to: &f{values}"
  sa-list-added: "&aSA safilter {type} appended: &f{values}"
  sa-list-removed: "&aSA safilter {type} removed: &f{values}"
  sa-list-missing: "&eNot present in safilter: &f{values}"
  sa-list-none: "&eNothing matched to remove: &f{values}"
  sa-list-cleared: "&aSA safilter {type} class cleared"
  sa-list-usage: "&7Usage: &f/msl super_active <entity|player> <set|add|remove|clear> [values...]"
  sa-filter-alias: "&aSA safilter added group alias &f{input} &aexpanded into &f{count} &aentities"
  sa-filter-cleared: "&aSA safilter cleared; back to default (any target)"
  sa-filter-usage: "&7Usage: &f/msl super_active filter <list|clear>"
  # ---- IR parameters (/msl ir ...) ----
  ir-mode-default: "&aIR seeker: default (players first)"
  ir-mode-player: "&aIR seeker: players first"
  ir-mode-entity: "&aIR seeker: players first, switch to any creature after losing lock"
  ir-usefilter-on: "&aIR seeker: usefilter on (follow the filter whitelist only)"
  ir-usefilter-off: "&aIR seeker: usefilter off"

kind:
  player: "player"
  entity: "entity"
  # ANY: the candidate types come from the filter whitelist (/msl ir ... usefilter)
  any: "player/creature"

# "Target" field (%msl_target_kind%): used by the ActionBar and the placeholder.
# 1.0.3 rules:
#  · normal missiles - the ACTIVE classes (filter whitelist); no concrete target listed = Any
#  · super active   - the CONTENT of safilter: entries of both classes = Mixed
target:
  player: "player"
  entity: "entity"
  mixed: "Mixed"
  any: "Any"

# Short mode labels (shown by /msl status for the persistent /msl ir ... settings)
mode:
  ir-default: "default (players first)"
  ir-player: "players first"
  ir-entity: "players first, switch to any creature after losing lock"

decoy:
  # key convention: decoy.<material name, lowercase, underscores to hyphens>
  blaze-powder: "blaze powder"
  iron-nugget: "iron nugget"
  immune: "immune"

type:
  infrared: "Infrared"
  semi-active: "Semi-Active Radar"
  active: "Active Radar"
  semi-los: "Semi-Automatic LOS"

seeker:
  # ActionBar template: %msl% / %msl_target_kind% / %msl_entity_name% are substituted
  # (see MissilePlaceholders). The same tokens are PlaceholderAPI placeholders, so TAB and
  # scoreboard plugins can reuse them.
  # Override this line with "seeker.status" under messages: in config.yml.
  status: "&7%msl% &7| &fTarget: %msl_target_kind% &7| &aLocked &f%msl_entity_name% &7| &fright-click to fire"
  status-beam: "&b{missile} &7| &fTarget: follows your screen crosshair &7| &fright-click to fire"
  lock-search: "&csearching"
  lock-found: "&alocked &f{target}"
  closed: "&7Seeker closed (hold TNT)"
  need-illumination: "&c{missile} needs a visible {kind} to keep illuminating; not fired"
  launched: "%msl% &aFired"
  designate-switch: "&aIllumination target switched: &f{target}"

missile:
  decoy-infrared: "&cIR seeker lost lock; decoyed by {target}'s dropped blaze powder"
  decoy-active: "&eActive radar jammed by iron nugget; lock lost, re-searching"
  decoy-semi-active: "&eSemi-active radar jammed by iron nugget; illumination link broken"

rwr:
  bossbar-track: "&e⚠ TRACKED &f{dir}"
  bossbar-track-multi: "&e⚠ TRACKED &f{dir} &7×{count}"
  bossbar-missile: "&c⚠ MISSILE &f{dir}"
  bossbar-missile-multi: "&c⚠ MISSILE &f{dir} &7×{count}"
  # Bearing arrows: your facing is up (↑), 8 sectors clockwise
  # (12 / 1:30 / 3 / 4:30 / 6 / 7:30 / 9 / 10:30 o'clock)
  dir-0: "↑"
  dir-1: "↗"
  dir-2: "→"
  dir-3: "↘"
  dir-4: "↓"
  dir-5: "↙"
  dir-6: "←"
  dir-7: "↖"

# MAWS (Missile Approach Warning System): alerts when any missile in flight is within 40 blocks;
# coexists with RWR as a second, red boss bar.
# %msl_maws% is replaced by the bearing arrow (it reuses the rwr.dir-0..7 entries above).
# Override the text with "maws.bossbar" under messages: in config.yml.
maws:
  bossbar: "&c⚠ MAWS: %msl_maws%"

# Target filter (/missile filter ...)
filter:
  usage: "&7Usage: &f/missile filter <entity|player|clear|on|off> [set|add|remove|clear] [id...] &7e.g. &f/missile filter entity add zombie skeleton"
  applied: "&aFilter updated: &f{mode} &7(see /missile filter list)"
  applied-type: "&aUpdated &f{type} &afilter: &f{values}"
  cleared-all: "&aAll filter data cleared"
  cleared-entity: "&aEntity filter data cleared"
  cleared-player: "&aPlayer filter data cleared"
  # ---- remove (1.0.3): drop already-added entries from the list ----
  removed-type: "&aRemoved from the {type} filter: &f{values}"
  removed-none: "&eNo such entries in the {type} filter"
  removed-missing: "&eThese entries were not in the list: &f{values}"
  mode-all: "free targeting (filter data ignored)"
  mode-filter: "only targets inside the filter whitelist"
  error-empty-whitelist: "&cThe whitelist is empty, so filter mode was NOT enabled (an empty whitelist locks nothing). Set it first with /missile filter entity <id> or /missile filter player <name>"
  auto-off-empty: "&eThe whitelist is now empty, so filter mode was turned off automatically (back to free targeting)"
  error-need-value: "&c{mode} needs at least one id; that argument was ignored"
  error-player-as-entity: "&cCannot use minecraft:player as an entity id (use the player type)"
  unknown-id: "&cUnknown entity id: &f{input} &7(use zombie or minecraft:zombie)"
  alias-expanded: "&7Note: &f{input} &7is a group alias; expanded into &f{count} &7entity ids"
  unknown-player: "&cPlayer not found: &f{input}"
  values-any-entity: "any creature (no id specified)"
  values-all-players: "all players"
  list-header: "&6[Missile] &fCurrent target filter: &e{mode}"
  list-types: "&7Enabled types: &f{types}"
  list-ids: "&7Entity whitelist: &f{ids}"
  list-players: "&7Player whitelist: &f{players}"
  none: "(none)"

# Super active missile (/msl super_active)
super_active_name: "Super Active Missile"
super_active_no_perm: "You do not have permission to use the super active missile"
